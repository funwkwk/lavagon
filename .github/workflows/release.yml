name: Release

# Push a tag like v1.0.0 to build Lavagon and publish a GitHub release with a portable zip.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable folder
        shell: pwsh
        run: ./build.ps1

      - name: Zip and checksum
        shell: pwsh
        run: |
          $zip = "Lavagon-${{ github.ref_name }}-portable.zip"
          Compress-Archive -Path dist/Lavagon -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content "$zip.sha256" "$hash  $zip" -NoNewline

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = @("Lavagon-$tag-portable.zip", "Lavagon-$tag-portable.zip.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. published by hand): refresh its assets.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Lavagon $tag" --generate-notes
          }
