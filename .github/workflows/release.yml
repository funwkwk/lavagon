name: Release

# Manual only. The normal way to publish a release is the local script:
#   powershell -ExecutionPolicy Bypass -File release.ps1 -Version 1.0.1
# This workflow does the same on GitHub's runners for an existing tag (Actions tab > Run workflow).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v1.0.1
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build portable folder
        shell: pwsh
        run: ./build.ps1

      - name: Zip, installer and checksums
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag }}"
          Compress-Archive -Path dist/Lavagon -DestinationPath "Lavagon-$tag-portable.zip"
          Copy-Item dist/Lavagon-Setup.exe "Lavagon-Setup-$tag.exe"
          foreach ($f in "Lavagon-Setup-$tag.exe", "Lavagon-$tag-portable.zip") {
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            Set-Content "$f.sha256" "$hash  $f" -NoNewline
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ inputs.tag }}"
          $files = @("Lavagon-Setup-$tag.exe", "Lavagon-Setup-$tag.exe.sha256", "Lavagon-$tag-portable.zip", "Lavagon-$tag-portable.zip.sha256")
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. published by hand): refresh its assets.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --title "Lavagon $tag" --generate-notes
          }
